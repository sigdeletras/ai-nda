name: Deploy presentation

on:
  push:
    branches: [master]
    paths:
      - 'presentacion/**'
      - '.github/workflows/deploy-presentation.yml'
  pull_request:
    paths:
      - 'presentacion/**'
      - '.github/workflows/deploy-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: presentacion/package-lock.json
      - name: Resolve lockfile
        working-directory: presentacion
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install dependencies
        working-directory: presentacion
        run: npm ci --ignore-scripts --no-audit
      - name: Dependency audit
        working-directory: presentacion
        run: npm audit --audit-level=high
      - name: Build
        working-directory: presentacion
        run: npm run build
      - name: Verify Pages base path
        working-directory: presentacion
        run: |
          test -f dist/index.html
          grep -q '/ai-nda/assets/' dist/index.html
      - name: Browser checks
        working-directory: presentacion
        env:
          CI: true
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: presentacion/dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
