name: Deploy presentation
on:
  push:
    branches: [master]
    paths: ['presentacion/**', '.github/workflows/deploy-presentation.yml']
  pull_request:
    paths: ['presentacion/**', '.github/workflows/deploy-presentation.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: presentacion/package-lock.json
      - name: Resolve lockfile
        working-directory: presentacion
        run: npm install --package-lock-only
      - name: Install dependencies
        working-directory: presentacion
        run: npm ci
      - name: Build
        working-directory: presentacion
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: presentacion/dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
