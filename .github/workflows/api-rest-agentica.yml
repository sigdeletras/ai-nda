name: API REST demo - CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/api-rest-agentica
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/api-rest-agentica/pyproject.toml
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Dependency audit
        run: pip-audit
      - name: Tests
        env:
          JWT_SECRET_KEY: test-only-secret-for-ci-1234567890
          DATABASE_URL: sqlite://
        run: pytest
      - name: Bandit
        run: bandit -r app
      - name: Build image
        run: docker build -t api-rest-agentica:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: api-rest-agentica:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
