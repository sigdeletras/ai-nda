name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/api-rest-agentica/pyproject.toml
      - name: Install
        working-directory: examples/api-rest-agentica
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: examples/api-rest-agentica
        run: ruff check .
      - name: Ruff format
        working-directory: examples/api-rest-agentica
        run: ruff format --check .
      - name: Tests
        working-directory: examples/api-rest-agentica
        env:
          JWT_SECRET_KEY: test-only-secret-for-ci-1234567890
        run: pytest
      - name: Bandit
        working-directory: examples/api-rest-agentica
        run: bandit -r app
      - name: Build image
        working-directory: examples/api-rest-agentica
        run: docker build -t api-rest-agentica:ci .
